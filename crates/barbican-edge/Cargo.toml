[package]
name = "barbican-edge"
description = "Applies the bans of barbican agents on a router (OpenWrt) with nftables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
barbican-common = { version = "0.1.0", path = "../barbican-common" }
pico-args = "0.5.0"
ring = "0.17.14"
rustix = { version = "1.1.6", default-features = false, features = ["event", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }
thiserror = "2.0.21"

[lints]
workspace = true
