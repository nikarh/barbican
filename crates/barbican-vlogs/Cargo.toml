[package]
name = "barbican-vlogs"
description = "Streams a VictoriaLogs query's history as timestamped lines, for barbican import and replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
barbican-common = { version = "0.1.0", path = "../barbican-common" }
futures-util = "0.3.34"
pico-args = "0.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls-no-provider", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
