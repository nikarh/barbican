[workspace]
resolver = "3"
members = ["crates/barbican", "crates/barbican-common", "crates/barbican-edge", "crates/barbican-vlogs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikarh/barbican"
readme = "README.md"
keywords = ["firewall", "nftables", "fail2ban", "openwrt", "intrusion-prevention"]
categories = ["network-programming", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
similar_names = "allow"
struct_field_names = "allow"
match_bool = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
# Duplicate transitive versions are tracked (with reasons) in deny.toml instead.
multiple_crate_versions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
panic = "abort"

# The edge agent runs on routers with little flash and memory.
[profile.release-small]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# The end-to-end tests: what the release builds are (no debug assertions, panics abort), but the workspace's own
# crates unoptimised, which compiles them in about half the time; the dependencies stay optimised.
[profile.e2e]
inherits = "release"
opt-level = 0

[profile.e2e.package."*"]
opt-level = 3
