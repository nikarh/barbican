# barbican-edge-ipset's configuration (UCI syntax, as on OpenWrt).
config barbican 'main'
	# 0: follow the agents and save the state, but leave the firewall alone.
	option enabled '1'
	# Also apply the agents' country blocks and blocking lists, not only their bans.
	option lists '1'
	# The last state, put back at boot. Written when it changed, at most this often (seconds): /jffs is flash.
	option state '/jffs/barbican/state.json'
	option persist_interval '3600'
	# IPv6 too (with ip6tables); off on most such routers.
	option ipv6 '0'

# One section per barbican agent to follow (its [edge] listen address, and the token of a client configured there).
#config upstream 'server'
#	option url 'http://192.168.1.10:7380'
#	option token_file '/jffs/barbican/server.token'
