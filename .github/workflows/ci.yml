name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain (with clippy and rustfmt) comes from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('web/package-lock.json') }}
      # Formatting, clippy, oxlint, the type check, tests, generated files and action pins (mise.toml).
      - run: mise run ci
      - name: The frontend builds
        run: npm --prefix web run build

  deny:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  packages:
    name: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/package.sh numbers a build of main by the commits up to it.
          fetch-depth: 0
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl armv7-unknown-linux-musleabihf
      # cargo-zigbuild's linker wrappers are in every crate's fingerprint, and their path changes with the tools in
      # mise.toml: a cache from other tools would be restored as a full match, rebuilt from scratch and never saved.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: zig github:rust-cross/cargo-zigbuild nfpm
      - run: cargo zigbuild --locked --release --target x86_64-unknown-linux-musl -p barbican
        env:
          BARBICAN_VERSION_SUFFIX: -dev+${{ github.sha }}
      - run: scripts/package.sh x86_64 target/x86_64-unknown-linux-musl/release/barbican out
        env:
          BARBICAN_VERSION_SUFFIX: -dev+${{ github.sha }}
      - name: The package installs
        run: |
          set -euo pipefail
          dpkg-deb --info out/barbican_amd64.deb
          sudo apt-get install -y --no-install-recommends ./out/barbican_amd64.deb
          barbican --version
          systemd-analyze verify /usr/lib/systemd/system/barbican.service
          sudo apt-get remove -y barbican
      # The edge agents, with OpenWrt packages (apk mkpkg runs in an Alpine container).
      - run: mise x -- scripts/build-edge.sh armv7 ipset-armv7

  e2e:
    name: end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      # cargo-zigbuild's linker wrappers are in every crate's fingerprint, and their path changes with the tools in
      # mise.toml: a cache from other tools would be restored as a full match, rebuilt from scratch and never saved.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl-${{ hashFiles('mise.toml') }}
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: zig github:rust-cross/cargo-zigbuild
      - name: Cache the VM images and the country database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/barbican-e2e/debian-13-genericcloud-amd64.qcow2
            ~/.cache/barbican-e2e/openwrt-*.img
            ~/.cache/barbican-e2e/dbip-country-lite.mmdb
          key: barbican-e2e-${{ hashFiles('e2e/vm.sh') }}-${{ github.run_id }}
          restore-keys: barbican-e2e-${{ hashFiles('e2e/vm.sh') }}-
      - run: e2e/run.sh
