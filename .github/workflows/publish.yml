name: Publish

# Builds, signs and uploads the release files when a release is published, and for the `latest` pre-release when the
# Latest workflow calls it: static (musl) agents with .deb and Arch Linux packages for x86_64 and aarch64, and the edge
# agent for routers (x86_64, aarch64, armv7) with its LuCI pages and installer.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version-suffix:
        description: Appended to the version from Cargo.toml, e.g. -dev+abc1234
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  CARGO_TERM_COLOR: always

jobs:
  agent:
    name: Agent (${{ matrix.arch }})
    # Only releases are built when published: the Latest workflow creates the `latest` pre-release once and publishes
    # it itself.
    if: >-
      github.repository_owner == 'nikarh'
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - run: rustup toolchain install && rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node zig cargo:cargo-zigbuild nfpm
      - name: Check the tag matches the version
        if: startsWith(env.TAG, 'v')
        run: test "$TAG" = "v$(cargo pkgid -p barbican | sed 's/.*[#@]//')"
      - name: Build the frontend
        run: npm --prefix web ci --no-audit --no-fund && npm --prefix web run build
      - run: cargo zigbuild --locked --release --target ${{ matrix.arch }}-unknown-linux-musl -p barbican
        env:
          BARBICAN_VERSION_SUFFIX: ${{ inputs.version-suffix }}
      - name: Archive and packages
        run: |
          set -euo pipefail
          bin=target/${{ matrix.arch }}-unknown-linux-musl/release/barbican
          mkdir -p out barbican
          cp "$bin" out/barbican-${{ matrix.arch }}-linux-musl
          cp "$bin" dist/barbican.service dist/config.toml README.md LICENSE-MIT LICENSE-APACHE barbican/
          tar -czf out/barbican-${{ matrix.arch }}-linux-musl.tar.gz barbican
          scripts/package.sh ${{ matrix.arch }} "$bin" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-agent-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  edge:
    name: Edge agent
    if: >-
      github.repository_owner == 'nikarh'
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: zig cargo:cargo-zigbuild
      - run: scripts/build-edge.sh
        env:
          BARBICAN_VERSION_SUFFIX: ${{ inputs.version-suffix }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-edge
          path: out/*
          if-no-files-found: error

  upload:
    name: Sign and upload
    needs: [agent, edge]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release
      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Checksums and signature
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --clobber
          # Files a newer build no longer has (on `latest`, which is uploaded to again and again).
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e release/$name ]] || gh release delete-asset "$TAG" "$name" --yes
          done
